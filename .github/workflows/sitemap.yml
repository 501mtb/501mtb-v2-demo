name: Generate and update sitemap

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**.pdf'
      - 'robots.txt'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    name: Generate sitemap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate XML sitemap
        id: sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://501mtb.github.io/
          date-only: true

      - name: Show sitemap results
        run: |
          echo "Sitemap: ${{ steps.sitemap.outputs.sitemap-path }}"
          echo "URLs included: ${{ steps.sitemap.outputs.url-count }}"
          echo "URLs excluded: ${{ steps.sitemap.outputs.excluded-count }}"

      - name: Commit and push sitemap when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "Sitemap is already up to date."
          else
            git commit -m "chore: update sitemap"
            git push
          fi
